{% extends "base_page.html" %}

{% block page-title %}

{% endblock %}

{% block page-lead %}
<div class="container-sm px-5">
        <div class="row px-5 py-2">
			<div class="col-md-3">
                <label for="tr">Слово</label>
                <p class="fs-2"> {{ tr }} </p>
            </div>
			<div class="col-md-3">
				{% if img != "" %}
					<br/>
					<img src="{{img}}" width="64" height="64">
				{% endif %}
            </div>
			<div class="col-md-3">
                <label for="new_img">Перевод</label>
                <textarea type="text" class="form-control input-lg fs-2" name="word" id="word" aria-describedby="img_note" rows="1"></textarea>
            </div>
			<div class="col-md-3">
				</br>
				<div class="row px-5">
					<button onclick="check_word()" class="btn btn-outline-secondary">Проверить</button>
					<script>
							let word = "{{ word|escapejs }}";
							function check_word() {
								if ( document.getElementById("word").value === word ){
									document.getElementById("result").textContent="Верно!";
									setTimeout(reload, 3000);
								}else{
									document.getElementById("result").textContent="Ошибка! Неправильное слово";
								}
							}
							function reload() {
								window.location.replace("/test");
							}
					</script>
				</div>
			</div>
        </div>
		<div class = "row px-5">
			<div class="col-md-12">
                <p class="fs-2 text-center" id="result">  </p>
            </div>
		</div>
</div>
{% endblock %}


{% block content %}

{% endblock %}
